<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Step 3</title>
</head>
<body>
    <h1>Sign Up - Step 3</h1>
    <h2>Work Experience</h2>

    <form action="signup4.html" method="get">
        <label for="job-title">Current Job Title:</label>
        <input type="text" id="job-title" name="job-title">
        <br><br>

        <label for="experience">Years of Experience:</label>
        <input type="number" id="experience" name="experience" min="0" max="60">
        <br><br>

        <label for="start-date">Employment Start Month:</label>
        <input type="month" id="start-date" name="start-date">
        <br><br>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        <br><br>

        <label for="skills">Skills:</label>
        <input list="skill-list" id="skills" name="skills">
        <datalist id="skill-list">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
            <option value="Graphic Design">
            <option value="Communication">
            <option value="Microsoft Office">
        </datalist>
        <br><br>

        <button type="button" onclick="location.href='signup2.html'">Previous</button>
        <button type="submit">Next</button>
    </form>

    <p><a href="index.html">Back to Home</a></p>
</body>
</html>
