<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Step 4</title>
</head>
<body>
    <h1>Sign Up - Step 4</h1>
    <h2>Preferences</h2>

    <form action="index.html" method="get">
        <input type="checkbox" id="notifications" name="notifications" value="yes">
        <label for="notifications">Receive Notifications</label>
        <br><br>

        <label for="job-location">Preferred Job Location:</label>
        <select id="job-location" name="job-location" multiple size="4">
            <option value="Karachi">Karachi</option>
            <option value="Lahore">Lahore</option>
            <option value="Islamabad">Islamabad</option>
            <option value="Remote">Remote</option>
            <option value="Other">Other</option>
        </select>
        <br><br>


        <button type="button" onclick="location.href='signup3.html'">Previous</button>
        <button type="submit">Submit</button>
    </form>

    <p><a href="index.html">Home Page</a></p>
</body>
</html>
